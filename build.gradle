plugins {
    id 'java'
    id 'application'
}

group 'com.hibiscusgames.gothicvania'
version '1.0'

repositories {
    mavenCentral()
    maven { url 'https://maven.pkg.jetbrains.space/litiengine/p/maven/releases' }
}

dependencies {
    implementation 'de.gurkenlabs:litiengine:0.12.0'
}

application {
    mainClass = 'com.hibiscusgames.gothicvania.Main'
}
